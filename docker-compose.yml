version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: finmodel_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234lazizxon007
      POSTGRES_DB: finmodel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: finmodel_backend
    restart: always
    depends_on:
      - postgres
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:1234lazizxon007@postgres:5432/finmodel_db?schema=public
      JWT_SECRET: finmodel-super-secret-jwt-key-2026
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TZ: Asia/Tashkent
    ports:
      - "5000:5000"
    volumes:
      - server_uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: finmodel_frontend
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  postgres_data:
  server_uploads:
