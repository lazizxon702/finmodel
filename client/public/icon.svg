<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#065f46" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="#0b0f19"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#glow)"/>

  <!-- Inner 3D card accent -->
  <path d="M 120 160 L 256 90 L 392 160 L 392 340 L 256 410 L 120 340 Z" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.25"/>

  <!-- Monogram FM -->
  <g fill="#ffffff" font-family="Inter, -apple-system, system-ui, sans-serif" font-weight="900" font-size="160" text-anchor="middle" dominant-baseline="central">
    <text x="256" y="260" letter-spacing="-4">FM</text>
  </g>

  <!-- Subtitle -->
  <text x="256" y="380" fill="#a7f3d0" font-family="Inter, -apple-system, system-ui, sans-serif" font-weight="800" font-size="34" text-anchor="middle" letter-spacing="4">FINMODEL</text>
</svg>
